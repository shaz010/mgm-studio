name: Build Android AAB (API 36)

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Release note'
        required: false
        default: 'Updated Android target API to 36'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" --sdk_root=$ANDROID_HOME

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signing.keystore
          ls -la signing.keystore

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'MANIFEST'
          {
            "packageId": "com.getcommissionpro.yoursalon",
            "host": "getcommissionpro.com",
            "name": "Your Salon",
            "launcherName": "Your Salon",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "startUrl": "/salon.html",
            "iconUrl": "https://getcommissionpro.com/icons/icon-512.png",
            "maskableIconUrl": "https://getcommissionpro.com/icons/icon-512.png",
            "monochromeIconUrl": "https://getcommissionpro.com/icons/icon-512.png",
            "appVersion": "2",
            "appVersionCode": 2,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "yoursalon"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 19,
            "targetSdkVersion": 36,
            "orientation": "default",
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "shortcuts": [],
            "generatorApp": "bubblewrap"
          }
          MANIFEST
          cat twa-manifest.json

      - name: Inject signing passwords into manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          tmp=$(mktemp)
          jq --arg pw "$KEYSTORE_PASSWORD" \
            '.signingKey.keypassword = $pw | .signingKey.storepassword = $pw' \
            twa-manifest.json > "$tmp"
          mv "$tmp" twa-manifest.json
          echo "Manifest updated with passwords (redacted for log):"
          jq 'del(.signingKey.keypassword, .signingKey.storepassword)' twa-manifest.json

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          pip install pexpect --break-system-packages -q
          cat > /tmp/build_aab.py << 'PYEOF'
import pexpect, os, sys

password = os.environ.get('KEYSTORE_PASSWORD', '')

child = pexpect.spawn(
    'bubblewrap build --skipPwaValidation',
    timeout=600,
    encoding='utf-8'
)
child.logfile_read = sys.stdout

while True:
    idx = child.expect([
        r'\(Y/n\)',
        r'Password for',
        pexpect.EOF,
        pexpect.TIMEOUT,
    ], timeout=120)

    if idx == 0:
        child.sendline('Y')
    elif idx == 1:
        child.sendline(password)
    elif idx == 2:
        break
    else:
        sys.stderr.write('\nTimeout waiting for bubblewrap!\n')
        child.close(force=True)
        sys.exit(1)

child.close()
exit_code = child.exitstatus if child.exitstatus is not None else 0
print(f'\nbubblewrap exited with code {exit_code}')
sys.exit(exit_code)
PYEOF
          python3 /tmp/build_aab.py
          echo "Build complete. Listing outputs:"
          find . -name "*.aab" -o -name "*.apk" 2>/dev/null | grep -v ".gradle"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoursalon-api36
          path: |
            app-release-bundle.aab
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30
